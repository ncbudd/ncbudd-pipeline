name: Release image

# Reusable: build a multi-arch container image, gate it, publish it to a registry (GHCR by default) and make it
# verifiable.
#
#   1. scan     Build the amd64 image and run Trivy on it. Fails on HIGH/CRITICAL findings that have a fix.
#               Nothing is pushed yet.
#   2. publish  Runs in the GitHub Environment `production`. If that environment has a required reviewer, the
#               job waits for one approval (a tap in the GitHub mobile app). Then: build amd64 + arm64, push by
#               tag, cosign keyless sign, SBOM (anchore/sbom-action) attested with cosign, and a SLSA build
#               provenance attestation.
#
# Callers need these permissions on the job that uses this workflow (a reusable workflow cannot grant more than
# its caller gives it):
#   contents: read, packages: write, id-token: write, attestations: write
#
# Verify a published image:
#   cosign verify <image>@<digest> --certificate-identity-regexp '^https://github.com/<owner>/<repo>/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://<image>@<digest> --owner <owner>

on:
  workflow_call:
    inputs:
      image:
        description: Full image name without a tag, all lowercase, for example ghcr.io/ncbudd/ember-tide.
        type: string
        required: true
      tags:
        description: Tags to push, one per line, full references (image:1.2.3).
        type: string
        required: true
      context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: Dockerfile
      platforms:
        type: string
        default: linux/amd64,linux/arm64
      labels:
        description: OCI labels, one key=value per line.
        type: string
        default: ""
      environment:
        description: GitHub Environment used for the publish job (its required reviewers gate the release).
        type: string
        default: production
      scan-severity:
        type: string
        default: HIGH,CRITICAL
    outputs:
      digest:
        description: Digest (sha256:...) of the published image index.
        value: ${{ jobs.publish.outputs.digest }}

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the image name
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          if [ "$IMAGE" != "$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::error::The image name must be all lowercase."
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: scan-candidate:local
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-candidate:local
          scanners: vuln
          severity: ${{ inputs.scan-severity }}
          ignore-unfixed: true
          exit-code: "1"

  publish:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ inputs.tags }}
          labels: ${{ inputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless)
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ inputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the SBOM
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@$DIGEST"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
