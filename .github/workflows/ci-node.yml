name: CI (Node)

# Reusable: install and check a Node project (lockfile install, then your commands).

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      working-directory:
        type: string
        default: "."
      commands:
        description: Shell commands to run after checkout and Node setup, one per line.
        type: string
        default: |
          npm ci
          npm run build

permissions: {}

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Run
        working-directory: ${{ inputs.working-directory }}
        env:
          COMMANDS: ${{ inputs.commands }}
        run: bash -ec "$COMMANDS"
