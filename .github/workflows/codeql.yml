name: CodeQL

# Reusable: CodeQL code scanning. `languages` is a JSON list, for example ["python","javascript-typescript"].
# On private repos without GitHub Advanced Security, code scanning is unavailable, so the SARIF is not uploaded
# there: analysis still runs and the results are kept as a workflow artifact instead.
# build-mode `none` works for Python, JavaScript/TypeScript, Java/Kotlin and others without a build.

on:
  workflow_call:
    inputs:
      languages:
        type: string
        required: true
      build-mode:
        type: string
        default: none

permissions: {}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ inputs.build-mode }}
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: codeql-results
      - name: Keep results as an artifact (private repos)
        if: ${{ !cancelled() && github.event.repository.private }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-results
          retention-days: 14
